<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Lectura AI{% endblock %}</title>{% load static %}<link rel="stylesheet" href="{% static 'app.css' %}"><link rel="stylesheet" href="{% static 'live.css' %}"></head>
<body><nav><a class="brand" href="/">Lectura<span>AI</span></a><div>{% if user.is_authenticated %}<a href="{% url 'dashboard' %}">Dashboard</a><form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link">Log out</button></form>{% else %}<a href="{% url 'login' %}">Log in</a><a class="button small" href="{% url 'signup' %}">Get started</a>{% endif %}</div></nav>
<main>{% block content %}{% endblock %}</main><footer>Lectura AI · Graduation Project MVP</footer>{% block scripts %}{% endblock %}</body></html>
