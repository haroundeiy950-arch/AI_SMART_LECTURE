{% extends "base.html" %}
{% block content %}
<section class="section-heading"><div><span class="eyebrow">EDIT PRODUCT</span><h2>تعديل {{ product.title }}</h2></div><a class="ghost-button" href="/backend/products">رجوع</a></section>
<article class="panel edit-product-panel">
  <form class="stack-form" method="post" action="/backend/products/{{ product.id }}/edit" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="edit-product-preview">
      {% if product.image_filename %}<img src="/product-media/{{ product.image_filename }}" alt="{{ product.title }}">{% else %}<span>📦</span>{% endif %}
    </div>
    <label>اسم المنتج<input name="title" value="{{ product.title }}" required maxlength="180"></label>
    <div class="form-row">
      <label>الفئة<select name="category">{% for key,label in categories %}<option value="{{ key }}" {% if product.category == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
      <label>الحالة<select name="condition">{% for key,label in conditions %}<option value="{{ key }}" {% if product.condition == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    </div>
    <div class="form-row">
      <label>السعر<input name="price" type="number" min="0" step="0.01" value="{{ '%.2f'|format(product.price_cents / 100) }}" required></label>
      <label>العملة<select name="currency">{% for currency in currencies %}<option value="{{ currency }}" {% if product.currency == currency %}selected{% endif %}>{{ currency }}</option>{% endfor %}</select></label>
    </div>
    <div class="form-row">
      <label>الكمية<input name="quantity" type="number" min="0" value="{{ product.quantity }}" required></label>
      <label>الموقع<input name="location" value="{{ product.location }}" maxlength="160"></label>
    </div>
    <label>رقم WhatsApp<input name="whatsapp" value="{{ product.whatsapp }}" maxlength="80"></label>
    <label>الوصف<textarea name="description" rows="6" maxlength="5000">{{ product.description }}</textarea></label>
    <label>استبدال الصورة<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <div class="checkbox-row">
      <label class="check-option"><input type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %}> نشر المنتج</label>
      <label class="check-option"><input type="checkbox" name="is_featured" {% if product.is_featured %}checked{% endif %}> منتج مميز</label>
    </div>
    <button class="primary-button" type="submit">حفظ التعديلات</button>
  </form>
</article>
{% endblock %}
